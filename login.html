<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Dialer — Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --accent: #5b6fd6; }
    body { background: #0e1018; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
    .card { background: #151923; border: 1px solid #2a3348; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #e2e8f0; }
    .logo i { color: var(--accent); }
    .form-control, .form-select { background: #0e1018; border-color: #2a3348; color: #e2e8f0; }
    .form-control::placeholder { color: #475569; }
    .form-control:focus { background: #0e1018; border-color: var(--accent); color: #e2e8f0; box-shadow: 0 0 0 .15rem rgba(91,111,214,.25); }
    .form-label { color: #94a3b8; font-size: .85rem; }
    .btn-primary { background: var(--accent); border-color: var(--accent); }
    .btn-primary:hover { background: #4a5fc4; border-color: #4a5fc4; }
    .tab-btns { display: flex; background: #0e1018; border-radius: 8px; padding: 3px; margin-bottom: 1.5rem; }
    .tab-btn { flex: 1; padding: .45rem; border: none; border-radius: 6px; background: transparent; color: #64748b; font-size: .9rem; font-weight: 500; cursor: pointer; transition: all .15s; }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .alert-danger { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.3); color: #fca5a5; font-size: .85rem; }
    .sep { color: #2a3348; font-size: .75rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo mb-4 text-center">
      <i class="bi bi-telephone-fill me-2"></i>Power Dialer
    </div>

    <div class="tab-btns" id="tabs">
      <button class="tab-btn active" onclick="showTab('login')">Sign In</button>
      <button class="tab-btn" onclick="showTab('register')">Create Account</button>
    </div>

    <div id="error-msg" class="alert alert-danger d-none mb-3"></div>

    <!-- Login form -->
    <form id="form-login" onsubmit="submitLogin(event)">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="login-email" class="form-control" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="btn-login" class="btn btn-primary w-100">
        Sign In
      </button>
    </form>

    <!-- Register form -->
    <form id="form-register" class="d-none" onsubmit="submitRegister(event)">
      <div class="mb-3">
        <label class="form-label">Company / Team Name</label>
        <input type="text" id="reg-name" class="form-control" placeholder="ACME Sales" required minlength="2" maxlength="100">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="reg-email" class="form-control" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label">Password <span class="sep">(8+ characters)</span></label>
        <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" id="btn-register" class="btn btn-primary w-100">
        Create Account
      </button>
    </form>
  </div>

  <script>
    function showTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('form-login').classList.toggle('d-none', !isLogin);
      document.getElementById('form-register').classList.toggle('d-none', isLogin);
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', isLogin ? i === 0 : i === 1));
      hideError();
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('d-none');
    }

    function hideError() { document.getElementById('error-msg').classList.add('d-none'); }

    async function submitLogin(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.textContent = 'Signing in…';

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || 'Login failed'); return; }
        location.href = data.redirectTo || '/dialer.html';
      } catch { showError('Network error. Please try again.'); }
      finally { btn.disabled = false; btn.textContent = 'Sign In'; }
    }

    async function submitRegister(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('btn-register');
      btn.disabled = true; btn.textContent = 'Creating account…';

      try {
        const res  = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tenantName: document.getElementById('reg-name').value,
            email:      document.getElementById('reg-email').value,
            password:   document.getElementById('reg-password').value
          })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || 'Registration failed'); return; }
        location.href = data.redirectTo || '/setup.html';
      } catch { showError('Network error. Please try again.'); }
      finally { btn.disabled = false; btn.textContent = 'Create Account'; }
    }

    // Already logged in? Go straight to dialer.
    fetch('/api/auth/me').then(r => { if (r.ok) location.href = '/dialer.html'; });
  </script>
</body>
</html>
