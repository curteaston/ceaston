version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: hvac_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d hvac_crm']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD:-crm}@db:5432/hvac_crm
      PORT: 3001
      # Uncomment to require an API key (X-Api-Key header) — recommended when exposed to n8n
      # API_KEY: change-me
    ports:
      - '3001:3001'

volumes:
  pgdata:
