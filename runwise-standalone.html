<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RunWise Systems — Turn new HVAC leads into booked calls</title>
  <meta name="description" content="RunWise calls new HVAC leads fast, qualifies the request, books arrival windows when possible, and alerts your team when a dispatcher needs to step in." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <style>/* ============ RunWise Systems — Landing CSS ============ */

:root {
  /* Color tokens — RunWise palette */
  /* Brand: Deep Slate Blue #2F3C7E */
  --brand-950: #1d2552;
  --brand-900: #232b62;
  --brand-800: #2F3C7E;          /* Primary brand */
  --brand-700: #3d4d99;
  --brand-600: #5263b3;
  --brand-50:  #eef0f8;
  --brand-100: #d9deef;

  /* Ink: Charcoal #333540 */
  --ink: #333540;
  --ink-2: #44475a;              /* hover/lift on ink buttons */
  --ink-deep: #22242c;           /* deepest text */
  --charcoal: #333540;

  /* Cool neutrals */
  --slate-600: #4a4d5c;
  --slate-500: #6b6f80;
  --slate-400: #9094a3;
  --slate-300: #c4c8d4;
  --slate-200: #e2e5ec;
  --slate-100: #eef1f6;
  --slate-50:  #F3F5FA;
  --paper:     #F9FAFC;          /* Cool White */
  --paper-2:   #F3F5FA;
  --white:     #ffffff;

  /* Accent (interactive / focus) — Slate Blue family (replaces electric blue) */
  --accent: #2F3C7E;
  --accent-600: #283466;
  --accent-700: #1f2952;
  --accent-50:  #eef0f8;
  --accent-100: #dde1ef;

  /* Gold — punctuation only (logo mark, live badge, active states, eyebrow dots) */
  --gold:      #F4C95D;
  --gold-600:  #e1b647;
  --gold-50:   #fdf6df;
  --gold-100:  #fbecbd;

  /* Mint — secondary accent / success states */
  --mint:      #6bb088;          /* darker mint for type contrast */
  --mint-500:  #9CC9AA;          /* palette mint, used for surfaces/dots */
  --mint-50:   #eaf4ee;
  --mint-100:  #d6ebde;

  /* Functional */
  --amber:    #d49a2a;           /* urgency — distinct from gold by being deeper/orange-leaning */
  --amber-bg: #fbf2dc;
  --green:    var(--mint);
  --green-bg: var(--mint-50);
  --red:      #c2553f;

  /* Type */
  --font-display: "Geist", "Inter Tight", system-ui, sans-serif;
  --font-body: "Geist", -apple-system, system-ui, sans-serif;
  --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;

  /* Radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(10, 18, 32, 0.05);
  --shadow-md: 0 4px 12px -2px rgba(10, 18, 32, 0.08), 0 2px 4px rgba(10, 18, 32, 0.04);
  --shadow-lg: 0 20px 40px -12px rgba(10, 18, 32, 0.18), 0 4px 12px rgba(10, 18, 32, 0.06);
  --shadow-card: 0 0 0 1px var(--slate-200), 0 1px 2px rgba(10, 18, 32, 0.03);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "cv11";
}

body { line-height: 1.5; font-size: 16px; }

img, svg { display: block; max-width: 100%; }

a { color: inherit; text-decoration: none; }

button { font-family: inherit; cursor: pointer; border: none; background: none; }

h1, h2, h3, h4 {
  font-family: var(--font-display);
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
  font-weight: 600;
}

p { margin: 0; text-wrap: pretty; }

/* Layout */
.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 28px;
}

.section { padding: 96px 0; }
.section-tight { padding: 72px 0; }

@media (max-width: 720px) {
  .section { padding: 64px 0; }
  .section-tight { padding: 48px 0; }
  .container { padding: 0 20px; }
}

/* Eyebrow */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--slate-500);
  margin-bottom: 18px;
}
.eyebrow .dot {
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
}
.eyebrow.on-dark { color: var(--slate-300); }
.eyebrow.on-dark .dot { background: var(--gold); box-shadow: 0 0 12px rgba(244, 201, 93, 0.55); }

/* Headings */
.h1 {
  font-size: clamp(40px, 5.5vw, 64px);
  line-height: 1.02;
  letter-spacing: -0.035em;
  font-weight: 600;
}
.h2 {
  font-size: clamp(30px, 3.6vw, 44px);
  line-height: 1.08;
  letter-spacing: -0.028em;
  font-weight: 600;
}
.h3 {
  font-size: clamp(20px, 1.6vw, 22px);
  line-height: 1.25;
  font-weight: 600;
}
.lede {
  font-size: clamp(17px, 1.4vw, 19px);
  color: var(--slate-600);
  line-height: 1.5;
  max-width: 56ch;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 20px;
  border-radius: var(--r-md);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: -0.005em;
  transition: transform 0.06s ease, background 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }

.btn-primary {
  background: var(--ink);
  color: var(--white);
  box-shadow: 0 1px 2px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.08);
}
.btn-primary:hover { background: var(--ink-2); }

/* btn-accent: cool-white on dark sections (Pilot, Final CTA) */
.btn-accent {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,0.15), inset 0 -1px 0 rgba(0,0,0,0.04);
}
.btn-accent:hover { background: var(--white); }

.btn-ghost {
  color: var(--ink);
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--slate-300);
}
.btn-ghost:hover { background: var(--slate-100); }

.btn-ghost-dark {
  color: var(--white);
  background: transparent;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
}
.btn-ghost-dark:hover { background: rgba(255,255,255,0.06); }

.btn-sm { padding: 9px 14px; font-size: 14px; }

/* Cards */
.card {
  background: var(--white);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
}

/* Subtle grid background */
.grid-bg {
  background-image:
    linear-gradient(to right, rgba(10,18,32,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(10,18,32,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
}

.grid-bg-dark {
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
}

.dot-bg {
  background-image: radial-gradient(rgba(10,18,32,0.08) 1px, transparent 1px);
  background-size: 18px 18px;
}

/* ===== Nav ===== */
.nav-wrap {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: saturate(140%) blur(10px);
  background: rgba(251, 250, 247, 0.82);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s, background 0.2s;
}
.nav-wrap.scrolled {
  border-bottom-color: var(--slate-200);
  background: rgba(251, 250, 247, 0.92);
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.02em;
  font-size: 17px;
}
.nav { height: 76px; }
.nav-logo img { display: block; height: 38px; width: auto; }
.footer-logo img { display: block; height: 36px; width: auto; }
.nav-links {
  display: flex;
  gap: 28px;
  font-size: 14px;
  color: var(--slate-600);
}
.nav-links a:hover { color: var(--ink); }
.nav-cta { display: flex; align-items: center; gap: 10px; }
.nav-burger {
  display: none;
  width: 40px; height: 40px;
  border-radius: 8px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--slate-200);
  transition: background 0.15s;
}
.nav-burger:hover { background: var(--slate-50); }
.nav-burger span {
  display: block;
  width: 18px; height: 1.5px;
  background: var(--ink);
  transition: transform 0.22s, opacity 0.22s;
  transform-origin: center;
  border-radius: 1px;
}
.nav-burger.open span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
.nav-burger.open span:nth-child(2) { opacity: 0; }
.nav-burger.open span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

.mobile-menu {
  position: fixed;
  inset: 76px 0 0 0;
  background: rgba(34, 36, 44, 0.4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 49;
}
.mobile-menu.open { opacity: 1; pointer-events: auto; }
.mobile-menu-inner {
  background: var(--paper);
  border-top: 1px solid var(--slate-200);
  padding: 24px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: 0 12px 24px rgba(10, 18, 32, 0.08);
  max-height: calc(100vh - 76px);
  overflow-y: auto;
  transform: translateY(-12px);
  transition: transform 0.22s ease;
}
.mobile-menu.open .mobile-menu-inner { transform: translateY(0); }
.mobile-menu-inner a:not(.btn) {
  display: block;
  padding: 16px 4px;
  font-size: 17px;
  color: var(--ink);
  border-bottom: 1px solid var(--slate-100);
}
.mobile-menu-cta {
  display: grid;
  gap: 10px;
  margin-top: 18px;
}
.mobile-menu-cta .btn { padding: 14px 20px; font-size: 15px; }

@media (max-width: 820px) {
  .nav-links { display: none; }
  .nav-cta { display: none; }
  .nav-burger { display: inline-flex; }
}
@media (min-width: 821px) {
  .mobile-menu { display: none; }
}

/* ===== Hero ===== */
.hero {
  position: relative;
  background: var(--paper);
  padding: 56px 0 24px;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(10,18,32,0.06) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 75%);
  pointer-events: none;
}
.hero-grid {
  position: relative;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 64px;
  align-items: center;
}
@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; gap: 40px; }
}
.hero-support {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 24px;
  margin-top: 36px;
  max-width: 540px;
}
.hero-support-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14.5px;
  color: var(--slate-600);
}
.hero-support-item .check {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent-50);
  color: var(--accent-700);
  flex-shrink: 0;
  margin-top: 2px;
  display: grid; place-items: center;
}
.hero-cta {
  display: flex;
  gap: 10px;
  margin-top: 32px;
  flex-wrap: wrap;
}

/* Hero dashboard preview */
.hero-preview {
  position: relative;
}
.hero-preview-frame {
  background: var(--white);
  border-radius: var(--r-xl);
  box-shadow:
    0 0 0 1px var(--slate-200),
    0 30px 60px -20px rgba(10, 18, 32, 0.18),
    0 8px 20px -4px rgba(10, 18, 32, 0.08);
  overflow: hidden;
}
.hero-preview-chrome {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--slate-200);
  background: var(--slate-50);
}
.hero-preview-chrome .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--slate-300);
}
.hero-preview-chrome .url {
  margin-left: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--slate-500);
}

/* Live call card (in hero) */
.live-call {
  padding: 20px;
  display: grid;
  gap: 14px;
}
.live-call-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.live-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #8a6614;
  background: var(--gold-50);
  padding: 4px 8px;
  border-radius: 999px;
  font-weight: 500;
  box-shadow: inset 0 0 0 1px var(--gold-100);
}
.live-pulse {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold-600);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}
.call-timer {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--slate-500);
}
.lead-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  border-radius: var(--r-md);
  background: var(--slate-50);
}
.lead-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--brand-800);
  color: var(--white);
  display: grid; place-items: center;
  font-weight: 600;
  font-size: 14px;
}
.lead-meta { flex: 1; min-width: 0; }
.lead-name { font-size: 14px; font-weight: 500; }
.lead-sub { font-size: 12.5px; color: var(--slate-500); font-family: var(--font-mono); }

.transcript {
  display: grid;
  gap: 8px;
  padding: 14px;
  background: var(--slate-50);
  border-radius: var(--r-md);
  font-size: 13px;
  line-height: 1.45;
  max-height: 156px;
  overflow: hidden;
  position: relative;
}
.transcript::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 50px;
  background: linear-gradient(to bottom, transparent, var(--slate-50));
  pointer-events: none;
}
.t-line { display: flex; gap: 10px; }
.t-who {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--slate-400);
  flex-shrink: 0;
  width: 50px;
  padding-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.t-who.ai { color: var(--brand-800); }
.t-text { color: var(--charcoal); flex: 1; }
.cursor {
  display: inline-block;
  width: 8px; height: 14px;
  background: var(--gold-600);
  vertical-align: -2px;
  margin-left: 2px;
  animation: blink 0.9s steps(2, end) infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.call-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.pill {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: var(--slate-50);
  font-size: 12px;
  color: var(--slate-600);
}
.pill .ic { width: 14px; height: 14px; color: var(--slate-500); }
.pill strong { color: var(--ink); font-weight: 500; }

/* Floating side cards */
.float-card {
  position: absolute;
  background: var(--white);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-lg);
  padding: 12px 14px;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 2;
}
.float-card .ic-wrap {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.float-card.booking { top: 24px; right: -28px; }
.float-card.booking .ic-wrap { background: var(--green-bg); color: var(--green); }
.float-card.escalation { bottom: 30px; left: -36px; }
.float-card.escalation .ic-wrap { background: var(--amber-bg); color: var(--amber); }
.float-card .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate-500); }
.float-card .val { font-weight: 500; color: var(--ink); margin-top: 1px; }
@media (max-width: 980px) {
  .float-card.booking { right: 12px; top: -16px; }
  .float-card.escalation { left: 12px; bottom: -16px; }
}

/* Trust strip */
.trust-strip {
  border-top: 1px solid var(--slate-200);
  border-bottom: 1px solid var(--slate-200);
  background: var(--paper);
  padding: 22px 0;
}
.trust-strip-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}
.trust-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--slate-500);
}
.trust-stats { display: flex; gap: 44px; flex-wrap: wrap; }
.trust-stat { display: flex; flex-direction: column; gap: 2px; }
.trust-stat .n { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.trust-stat .l { font-size: 12.5px; color: var(--slate-500); }

/* ===== Problem ===== */
.problem-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 64px;
  align-items: center;
}
@media (max-width: 900px) { .problem-grid { grid-template-columns: 1fr; gap: 40px; } }

.pain-list { display: grid; gap: 14px; margin-top: 28px; }
.pain {
  display: flex; gap: 14px;
  padding: 18px 18px;
  background: var(--white);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card);
}
.pain-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--slate-400);
  letter-spacing: 0.08em;
  width: 22px;
  flex-shrink: 0;
  padding-top: 3px;
}
.pain-text { font-size: 15px; color: var(--charcoal); line-height: 1.45; }
.pain-text strong { color: var(--ink); font-weight: 600; }

/* Speed-to-lead — narrow layout */
@media (max-width: 520px) {
  .speed-bar {
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .speed-bar .who { font-size: 13px; }
  .speed-bar .val {
    text-align: left;
    grid-row: 1;
    grid-column: 1;
    justify-self: end;
    margin-top: -22px;
  }
  .speed-bars { gap: 18px; }
}
.speed-viz {
  background: var(--white);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  padding: 24px;
}
.speed-title {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.speed-title h4 { font-size: 14px; font-weight: 500; margin: 0; }
.speed-title .tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--slate-500);
}
.speed-bars { display: grid; gap: 16px; }
.speed-bar { display: grid; grid-template-columns: 110px 1fr auto; align-items: center; gap: 14px; }
.speed-bar .who { font-size: 13px; color: var(--slate-600); }
.speed-bar .who strong { color: var(--ink); font-weight: 500; }
.speed-bar .track {
  height: 10px;
  background: var(--slate-100);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.speed-bar .fill {
  height: 100%;
  border-radius: 999px;
  background: var(--slate-400);
  transition: width 1.2s cubic-bezier(.2,.7,.2,1);
}
.speed-bar.runwise .fill { background: var(--mint); }
.speed-bar.you .fill { background: #94a0b0; }
.speed-bar.typical .fill { background: #b8bfcc; }
.speed-bar.afterhours .fill { background: linear-gradient(to right, #d0d5de 60%, #e8c98a); }
.speed-bar .val { font-family: var(--font-mono); font-size: 12px; color: var(--slate-600); min-width: 56px; text-align: right; }
.speed-foot {
  margin-top: 16px;
  font-size: 12px;
  color: var(--slate-500);

function Icon({ children, size = 15, stroke = 1.7, ...p }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" {...p}>
      {children}
    </svg>
  );
}

function VendorChip({ logoUrl, mark, markColor, IconComp, iconColor, label, pad }) {
  const [imgOk, setImgOk] = useState(!!logoUrl);
  return (
    <span className={`vendor-chip ${logoUrl && imgOk ? 'has-logo' : ''} ${pad ? 'pad' : ''}`} title={label} aria-label={label}>
      {logoUrl && imgOk ? (
        <img src={logoUrl} alt="" onError={() => setImgOk(false)} />
      ) : IconComp ? (
        <span className="vendor-icon" style={iconColor ? { color: iconColor } : null}><IconComp /></span>
      ) : (
        <span className="vendor-mark" style={{ color: markColor || 'var(--ink)' }}>{mark}</span>
      )}
    </span>
  );
}

/* =========================================================
   ROI
========================================================= */
function Roi() {
  const [leads, setLeads] = useState(50);      // monthly inbound leads
  const [recoverPct, setRecoverPct] = useState(15); // % of leads recovered
  const [gp, setGp] = useState(450);           // avg gross profit / recovered job

  const recovered = Math.round(leads * (recoverPct / 100));
  const monthly = recovered * gp;
  const annual = monthly * 12;

  return (
    <section className="section roi" id="roi">
      <div className="container roi-grid">
        <div>
          <div className="eyebrow"><span className="dot" />ROI</div>
          <h2 className="h2">Designed to pay for itself by recovering opportunities.</h2>
          <div style={{ height: 20 }} />
          <p className="lede">
            RunWise is priced around recovered opportunity value, not AI novelty. If faster response
            helps recover a few jobs each month that would have otherwise gone cold, the system can
            become an obvious operational win.
          </p>
          <p className="lede" style={{ marginTop: 16, fontSize: 15 }}>
            We model the math on <strong style={{ color: 'var(--ink)' }}>gross profit</strong> — not revenue —
            and we don't guarantee outcomes. Use the calculator as a sanity check, not a quote.
          </p>
        </div>

        <div className="roi-calc">
          <h4>Recovery sanity check</h4>
          <div className="sub">Tune the inputs to your shop</div>

          <div className="roi-row">
            <label>Monthly inbound leads</label>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <input type="range" min="10" max="300" step="5" value={leads}
                     onChange={e => setLeads(+e.target.value)} className="roi-slider" />
              <span className="num">{leads}</span>
            </div>
          </div>
          <div className="roi-row">
            <label>Jobs recovered vs. without RunWise</label>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <input type="range" min="2" max="20" step="1" value={recoverPct}
                     onChange={e => setRecoverPct(+e.target.value)} className="roi-slider" />
              <span className="num">{recoverPct}%</span>
            </div>
          </div>
          <div className="roi-row">
            <label>Avg. gross profit per recovered job</label>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <input type="range" min="150" max="2000" step="50" value={gp}
                     onChange={e => setGp(+e.target.value)} className="roi-slider" />
              <span className="num">${gp}</span>
            </div>
          </div>

          <div className="roi-out">
            <div>
              <div className="lbl">Recovered GP</div>
              <div className="lbl-sub">{recovered} jobs/mo &middot; illustrative</div>
            </div>
            <div className="val">${monthly.toLocaleString()}<span style={{ fontSize: 14, color: 'var(--slate-400)', fontFamily: 'var(--font-mono)', marginLeft: 6 }}>/mo</span></div>
          </div>
          <div className="roi-disclaimer">
            Illustrative only. Real results depend on lead quality, close rates, ticket size, and how
            well RunWise is tuned to your dispatch process. Annualized: ${annual.toLocaleString()}.
          </div>
        </div>
      </div>
    </section>
  );
}

/* =========================================================

    s.async = true;
    document.body.appendChild(s);

  return (
    <section className="section challenge" id="challenge">
      <div className="container">
        <div className="challenge-card">

              <span className="dot" />30‑second challenge

            <h2 className="h2">Want to see how fast your leads could be called?</h2>
            <p className="lede" style={{ margin: '12px auto 0' }}>
              Submit a test request and experience the response flow for yourself.

          <div className="ghl-form-wrap">
            <iframe
              src="https://api.leadconnectorhq.com/widget/form/GSuMKD7GFMhd0SUdlyAC"

              id="inline-GSuMKD7GFMhd0SUdlyAC"
              data-layout='{"id":"INLINE"}'

/* =========================================================
   FAQ
========================================================= */
const faqs = [
  { q: 'Does RunWise replace my dispatcher?',
    a: 'No. It supports the team by handling fast lead response and routing the right calls to humans. Your dispatcher focuses on booked work and exceptions; RunWise handles the noisy top of the funnel.' },
  { q: 'Can it book appointments?',
    a: 'Yes, when calendar or booking access is available. RunWise offers arrival windows you actually control — not vague promises.' },
  { q: 'What happens with urgent or safety‑related calls?',
    a: 'They are flagged and escalated based on the client\u2019s rules. Gas smells, electrical concerns, no‑heat in extreme weather, anything you tell us to treat as urgent — routed to a human immediately.' },
  { q: 'What if we use ServiceTitan or Housecall Pro?',
    a: 'RunWise can often support these workflows through approved APIs, Zapier, Make, calendar syncs, or booking links, depending on the access available in your account. We scope this during the pilot — no universal promise.' },
  { q: 'What lead sources can it handle?',
    a: 'GHL forms, website forms, email lead notifications, and other structured lead sources. If a lead has a phone number and arrives in a known format, RunWise can act on it.' },
  { q: 'Where does call data live?',
    a: 'In your RunWise/GHL workspace — outcome, transcript, recording, and notes for every call. Booked appointments are pushed to your FSM (ServiceTitan, Housecall Pro, etc.) where API, Zapier, Make, calendar, or booking‑link access is available.' },
];

  const [open, setOpen] = useState(0);

}
